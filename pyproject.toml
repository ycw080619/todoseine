[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "todoseine"
version = "0.4.1"
description = "Local-first chat log to todo extractor"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "TodoSeine contributors" }]
keywords = ["chat", "todo", "qq", "local-first", "privacy", "markdown"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Office/Business",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.17,<0.18"]
db = ["sqlcipher3>=0.6.2"]
snap = ["winsdk>=1.0.0b10"]   # 截图待办的快速 OCR（不装则回退 PowerShell，慢 2~3 秒）
# Qt 桌面看板（Windows 11）：PySide6 + 截图用的 Pillow + Win11 系统 OCR 绑定
qt = ["PySide6>=6.6", "pillow>=10", "winrt-runtime>=2.0", "winrt-Windows.Media.Ocr>=2.0",
      "winrt-Windows.Graphics.Imaging>=2.0", "winrt-Windows.Storage.Streams>=2.0",
      "winrt-Windows.Foundation>=2.0", "winrt-Windows.Foundation.Collections>=2.0",
      "winrt-Windows.Globalization>=2.0"]

[project.scripts]
c2t = "todoseine.cli:main"

[project.urls]
Homepage = "https://github.com/ycw080619/todoseine"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# 显式固定规则集：ruff 版本升级换了默认规则也不会让 CI 突然变红
select = ["E4", "E7", "E9", "F"]

