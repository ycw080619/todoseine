name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.9", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Test
        run: python -m unittest discover -s tests -v
      - name: Lint
        run: ruff check src tests
      - name: Smoke test CLI
        if: runner.os == 'Linux'
        run: |
          python -m chat2todo import examples/sample_qq_export.txt --db /tmp/c2t.db
          python -m chat2todo todos --db /tmp/c2t.db
